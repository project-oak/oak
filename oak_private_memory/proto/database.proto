// Private memory service definition: A memory consists of a datablob content
// and one or more tags. The service allows users to add a tagged memory and get
// the memories by tags.

syntax = "proto3";

package oak.private_memory;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

// A simple key value pair.
message DataBlob {
  string id = 1;
  bytes blob = 2;
}

message WriteUnencryptedDataBlobRequest {
  DataBlob data_blob = 1;

  // The lock token returned by AcquireUnencryptedDataBlobLock, or empty if the
  // caller does not hold a lock.
  //
  // The write is rejected with ABORTED if it is empty and the row is locked, or
  // if it is set but the lock it refers to is no longer held - because it
  // expired, or because another caller took the row over. The latter tells a
  // caller that stalled past its lease that it lost the lock, instead of
  // letting it write after its critical section ended.
  //
  // ABORTED means "somebody else owns this row, back off and retry later". It
  // is deliberately distinct from the FAILED_PRECONDITION / version_conflict
  // that WriteMetadataBlob uses for an optimistic concurrency conflict, which
  // instead means "re-read, rebase and retry now".
  string lock_token = 2;
}

message WriteDataBlobRequest {
  DataBlob data_blob = 1;
  google.protobuf.Timestamp coarsened_expiration_timestamp = 2;
}

message WriteDataBlobResponse {}

message WriteUnencryptedDataBlobResponse {}

message ReadDataBlobRequest {
  string id = 1;
}

message ReadUnencryptedDataBlobRequest {
  string id = 1;
  // Whether to perform a strong read to ensure the latest data is returned.
  bool strong_read = 2;
}

message ReadDataBlobResponse {
  DataBlob data_blob = 1;
}

message ReadUnencryptedDataBlobResponse {
  DataBlob data_blob = 1;
}

// A metadata blob containing a version.
message MetadataBlob {
  // The data blob containing the metadata info.
  DataBlob data_blob = 1;

  // An opaque version string representing the version of this metadata blob.
  // The string should not be parsed or interpreted by the client. It should
  // only be saved to pass back verbatim to calls to WriteMetadataBlob.
  string version = 2;
}

message ReadMetadataBlobRequest {
  string id = 1;
  google.protobuf.Timestamp coarsened_expiration_timestamp = 2;
}

message ReadMetadataBlobResponse {
  MetadataBlob metadata_blob = 1;
}

message WriteMetadataBlobRequest {
  MetadataBlob metadata_blob = 1;
  google.protobuf.Timestamp coarsened_expiration_timestamp = 2;

  // The lock token returned by AcquireUnencryptedDataBlobLock, or empty if the
  // caller does not hold a lock. The metadata blob lives in the same row as
  // the unencrypted data blob, so it is covered by the same lock. See
  // WriteUnencryptedDataBlobRequest.lock_token.
  string lock_token = 3;

  // Optional. If set, the unencrypted data blob is written in the same Spanner
  // transaction as the metadata blob, so the two columns of the row are updated
  // atomically. The id must match metadata_blob.data_blob.id.
  //
  // This exists for migrations that have to change the encryption key and the
  // data it protects together. The wrapped DEK lives in this column while the
  // ciphertext it decrypts is reachable through MetadataBlobRef, so writing
  // them in two transactions leaves a window where a crash makes the user
  // permanently undecryptable: whichever column landed first describes data
  // encrypted under the other column's key.
  //
  // Callers that only update the metadata blob should leave this unset.
  DataBlob unencrypted_data_blob = 4;
}

message WriteMetadataBlobResponse {
  // If true, the write was rejected due to a version mismatch (optimistic
  // concurrency conflict). The caller should re-fetch the current metadata,
  // re-apply changes, and retry.
  bool version_conflict = 1;
}

message ReadMetadataBlobStreamRequest {
  string id = 1;
  google.protobuf.Timestamp coarsened_expiration_timestamp = 2;
}

message ReadMetadataBlobStreamResponse {
  oneof response {
    // The initial response containing the metadata. The blob field in the
    // data_blob can be empty or contain the first chunk.
    //
    // This variant should only be sent once, as the first request. Sending it
    // more than once will result in an error.
    MetadataBlob metadata_blob = 1;

    // Subsequent chunks of the blob. These will be concatenated in the order
    // received to construct the final payload. Sending this variant before
    // sending the metadata_blob will result in an error.
    bytes chunk = 2;
  }
}

message WriteMetadataBlobStreamRequest {
  oneof request {
    // The initial request containing the metadata. The blob field in the
    // data_blob can be empty or contain the first chunk.
    MetadataBlob metadata_blob = 1;

    // Subsequent chunks of the blob. They can be concatenated in the order
    // received to construct the final payload. The server will indicate the end
    // of the file by sending a half-close.
    bytes chunk = 2;
  }
  google.protobuf.Timestamp coarsened_expiration_timestamp = 3;

  // The lock token returned by AcquireUnencryptedDataBlobLock, or empty if the
  // caller does not hold a lock. Only read from the first message. See
  // WriteUnencryptedDataBlobRequest.lock_token.
  string lock_token = 4;

  // Optional. Only read from the first message. If set, the unencrypted data
  // blob is written in the same Spanner transaction as the metadata blob. See
  // WriteMetadataBlobRequest.unencrypted_data_blob.
  DataBlob unencrypted_data_blob = 5;
}

message WriteMetadataBlobStreamResponse {
  // If true, the write was rejected due to a version mismatch (optimistic
  // concurrency conflict). The caller should re-fetch the current metadata,
  // re-apply changes, and retry.
  bool version_conflict = 1;
}

message ResetDatabaseRequest {}

message ResetDatabaseResponse {}

message DeleteBlobsRequest {
  repeated string ids = 1;
}

message DeleteBlobsResponse {}

message ReadDataBlobsRequest {
  repeated string ids = 1;
}

message ReadDataBlobsResponse {
  // The data blobs that were successfully read, keyed by ID.
  map<string, DataBlob> data_blobs = 1;

  // IDs that failed to read, with their status.
  map<string, google.rpc.Status> failed_ids = 2;
}

message WriteDataBlobsRequest {
  repeated DataBlob data_blobs = 1;
  google.protobuf.Timestamp coarsened_expiration_timestamp = 2;
}

message WriteDataBlobsResponse {
  // IDs that failed to write, with their status.
  map<string, google.rpc.Status> failed_ids = 1;
}

// Acquires an exclusive, lease-based lock on the row of an unencrypted data
// blob.
//
// While the lock is held, any attempt to modify the row without the matching
// lock token is rejected. The lock is released either explicitly (via
// ReleaseUnencryptedDataBlobLock) or automatically once it expires, so a
// crashed client can never lock a row indefinitely.
message AcquireUnencryptedDataBlobLockRequest {
  // The ID of the unencrypted data blob row to lock. The row must already
  // exist, otherwise NOT_FOUND is returned.
  string id = 1;

  // How long the lock should be held before it is automatically released.
  // Defaults to 60 seconds when unset, and is capped at 10 minutes.
  //
  // The cap applies to this request, not to the lifetime of the lock: a caller
  // that needs the row for longer renews with ExtendUnencryptedDataBlobLock.
  google.protobuf.Duration lock_duration = 2;
}

message AcquireUnencryptedDataBlobLockResponse {
  // Opaque token identifying the acquired lock. It must be passed verbatim to
  // subsequent mutating requests for this row, and to Extend/Release. The
  // string should not be parsed or interpreted by the client.
  string lock_token = 1;

  // The time at which the lock is automatically released. Any mutation
  // attempted after this time no longer needs (nor honors) the lock token.
  google.protobuf.Timestamp lock_expire_time = 2;
}

// Extends the lifetime of a lock that is still held, e.g. for a caller that
// needs more time than originally requested.
message ExtendUnencryptedDataBlobLockRequest {
  string id = 1;

  // The token returned by AcquireUnencryptedDataBlobLock. Extending a lock that
  // has already expired or that is held by a different token fails with
  // ABORTED; the caller must acquire a new lock in that case.
  string lock_token = 2;

  // The new lifetime, relative to the time the request is processed. Defaults
  // to 60 seconds when unset, and is capped at 10 minutes.
  //
  // The cap applies to each request separately, so a caller that keeps renewing
  // keeps the row for as long as it likes. What the cap bounds is how long a
  // lock outlives a caller that stops renewing, not how long a live caller may
  // hold the row.
  google.protobuf.Duration lock_duration = 3;
}

message ExtendUnencryptedDataBlobLockResponse {
  // The new time at which the lock is automatically released.
  google.protobuf.Timestamp lock_expire_time = 1;
}

// Releases a lock before it expires, so that other writers do not have to wait
// out the remaining lifetime.
message ReleaseUnencryptedDataBlobLockRequest {
  string id = 1;

  // The token returned by AcquireUnencryptedDataBlobLock. Releasing a lock held
  // by a different token fails with ABORTED. Releasing a lock that is already
  // released or expired succeeds.
  string lock_token = 2;
}

message ReleaseUnencryptedDataBlobLockResponse {}

// The untrusted database service that the trusted application can connect to.
service SealedMemoryDatabaseService {
  // Writes a data blob to the database.
  rpc WriteDataBlob(WriteDataBlobRequest) returns (WriteDataBlobResponse) {}
  // Reads a data blob from the database.
  rpc ReadDataBlob(ReadDataBlobRequest) returns (ReadDataBlobResponse) {}

  // Write a metadata blob to the database.
  //
  // If the current version of the stored metadata blob does not match the
  // version provided in the request, the write will be rejected and
  // `version_conflict` will be set to `true` in the response.
  //
  // In this case, you should fetch the latest version using `ReadMetadataBlob`,
  // apply your changes on the latest version, and re-attempt the write
  // operation.
  rpc WriteMetadataBlob(WriteMetadataBlobRequest)
      returns (WriteMetadataBlobResponse) {}

  // Read a metadatablob from the database.
  //
  // The returned metadatablob will include a version string; this version
  // string should be provided verbatim in the call to WriteMetadataBlob if
  // changes are to be committed.
  rpc ReadMetadataBlob(ReadMetadataBlobRequest)
      returns (ReadMetadataBlobResponse) {}

  // Write a metadata blob to the database using a stream.
  // The first request message must contain the metadata_blob.
  // Subsequent request messages should contain chunks of the blob.
  //
  // There's no requirement on the chunk szies; they can very from
  // request-to-request, and be of any size, as llong as it fits in the message
  // size limit.
  rpc WriteMetadataBlobStream(stream WriteMetadataBlobStreamRequest)
      returns (WriteMetadataBlobStreamResponse) {}

  // Read a metadata blob from the database using a stream.
  // The first response message will contain the metadata_blob.
  // Subsequent response messages will contain chunks of the blob.
  //
  // The returned chunks can be of any size, and the size can vary from
  // response-to-response. The client should concatenate them in the order
  // received to construct the final payload.
  rpc ReadMetadataBlobStream(ReadMetadataBlobStreamRequest)
      returns (stream ReadMetadataBlobStreamResponse) {}

  // Writes an unencrypted data blob to the database.
  rpc WriteUnencryptedDataBlob(WriteUnencryptedDataBlobRequest)
      returns (WriteUnencryptedDataBlobResponse) {}
  // Reads an unencrypted data blob from the database.
  rpc ReadUnencryptedDataBlob(ReadUnencryptedDataBlobRequest)
      returns (ReadUnencryptedDataBlobResponse) {}

  // Resets the database. This is mainly used for testing.
  rpc ResetDatabase(ResetDatabaseRequest) returns (ResetDatabaseResponse) {}

  // Deletes multiple blobs from the database.
  rpc DeleteBlobs(DeleteBlobsRequest) returns (DeleteBlobsResponse) {}

  // Reads multiple data blobs from the database.
  rpc ReadDataBlobs(ReadDataBlobsRequest) returns (ReadDataBlobsResponse) {}

  // Writes multiple data blobs to the database.
  rpc WriteDataBlobs(WriteDataBlobsRequest) returns (WriteDataBlobsResponse) {}

  // Acquires a lock on the row of an unencrypted data blob, preventing it from
  // being modified by anyone who does not hold the returned lock token.
  //
  // The lock has a bounded lifetime and is released automatically when it
  // expires, so a caller that crashes cannot lock the row forever.
  //
  // Returns ABORTED if the row is already locked, and NOT_FOUND if the row does
  // not exist. ABORTED means "somebody else owns this row, back off and retry
  // later"; it is the same code that gated writes use for a lock conflict.
  rpc AcquireUnencryptedDataBlobLock(AcquireUnencryptedDataBlobLockRequest)
      returns (AcquireUnencryptedDataBlobLockResponse) {}

  // Extends the lifetime of a lock that is currently held by the caller.
  //
  // Returns ABORTED if the lock is no longer held by the given token (e.g.
  // because it already expired).
  rpc ExtendUnencryptedDataBlobLock(ExtendUnencryptedDataBlobLockRequest)
      returns (ExtendUnencryptedDataBlobLockResponse) {}

  // Releases a lock held by the caller before it expires.
  //
  // Returns ABORTED if the row is locked by a different token.
  rpc ReleaseUnencryptedDataBlobLock(ReleaseUnencryptedDataBlobLockRequest)
      returns (ReleaseUnencryptedDataBlobLockResponse) {}
}
