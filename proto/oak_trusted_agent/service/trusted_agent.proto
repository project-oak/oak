syntax = "proto3";

package oak.trusted_agent.v1;

option java_multiple_files = true;
option java_package = "com.google.oak.trusted_agent.v1";

// Request sent from a client to the Trusted Agent service.
message AgentRequest {
  oneof request {
    // A user prompt / message to be processed by the agent session.
    UserMessage user_message = 1;
  }
}

// Response sent from the Trusted Agent service to a client.
message AgentResponse {
  oneof response {
    // The response generated by the agent for the user message.
    AgentMessage agent_message = 1;
  }
}

// Represents a user message sent to the agent.
message UserMessage {
  string text = 1;
}

// Represents a response generated by the agent.
message AgentMessage {
  string text = 1;
}

// Service definition for streaming communication with an Oak Trusted Agent.
service TrustedAgentService {
  // Bi-directional streaming RPC for interactive agent sessions.
  // Each stream gets a new, dedicated Wasm sandbox instance, which is spun up
  // when the stream opens, stays alive for the lifetime of the stream, and is
  // torn down when the stream ends.
  //
  // If the agent fails to process a message, the server ends the stream with an
  // error status instead of sending a response.
  rpc Stream(stream AgentRequest) returns (stream AgentResponse);
}
