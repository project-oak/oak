syntax = "proto3";

package oak.benchmark;

import "proto/micro_rpc/options.proto";

// Request to run a benchmark.
message RunBenchmarkRequest {
  // Type of benchmark to run.
  BenchmarkType benchmark_type = 1;
  // Size of data to process (bytes).
  uint32 data_size = 2;
  // Number of iterations.
  uint32 iterations = 3;
  // Number of warmup iterations to run before measurement (not timed).
  uint32 warmup_iterations = 4;
  // Seed for deterministic pseudo-random data generation.
  //
  // Both the enclave and the Linux baseline must be given the same seed,
  // otherwise they operate on different data and the comparison is not
  // apples-to-apples. The host CLIs default this to a fixed constant rather
  // than deriving it from the clock.
  //
  // Explicitly optional: zero is a valid seed, so an unset field and a seed of
  // zero have to be distinguishable. When unset the service uses its default.
  optional uint64 seed = 5;
  // Working set size in bytes for memory-bound benchmarks (0 = use default).
  //
  // Which benchmarks read this, and what it means for each, is documented on
  // the benchmark types that use it.
  uint64 working_set_size = 6;
}

// Types of benchmarks supported.
enum BenchmarkType {
  BENCHMARK_TYPE_UNSPECIFIED = 0;

  BENCHMARK_TYPE_SHA256 = 1;
  BENCHMARK_TYPE_SHA512 = 6;
  BENCHMARK_TYPE_SHA3_256 = 7;
  BENCHMARK_TYPE_SHA3_512 = 8;

  BENCHMARK_TYPE_P256_SIGN = 2;

  BENCHMARK_TYPE_MEMORY_INSERT = 3;
  BENCHMARK_TYPE_MEMORY_LOOKUP = 4;
  BENCHMARK_TYPE_ARRAY_UPDATE = 5;
  BENCHMARK_TYPE_ALLOC_CHURN = 9;

  // Debug/connectivity test - returns dummy values without doing work.
  BENCHMARK_TYPE_DEBUG = 100;
}

// Result of a benchmark run.
message RunBenchmarkResponse {
  // TSC ticks elapsed during the benchmark.
  //
  // Populated on both platforms. This is the frequency-independent measure and
  // is the basis for the cycles-per-operation metric, which is the fairest way
  // to compare the enclave against the Linux baseline: it needs no TSC
  // frequency calibration and so cannot be skewed by a mis-detected frequency.
  uint64 elapsed_tsc = 1;
  // Elapsed time in nanoseconds.
  //
  // Populated only where a real clock is available (the Linux baseline). The
  // enclave has no clock, so this is 0 there and the host converts from
  // `elapsed_tsc` using a calibrated frequency.
  uint64 elapsed_ns = 2;
  // Number of iterations completed.
  uint32 iterations_completed = 3;
  // Total bytes processed.
  uint64 bytes_processed = 4;
  // Status code (0 = success, see BenchmarkError).
  uint32 status = 5;
  // Actual working set size used, in bytes. Lets the host report what was
  // really measured rather than what was requested.
  uint64 working_set_size = 6;
  // Checksum over the benchmark output.
  //
  // Guards against the compiler eliding the work and against the two platforms
  // silently computing different things: for a given benchmark, seed and
  // parameter set this value must match across the enclave and the baseline.
  uint64 checksum = 7;
  // Bitfield of instruction-set extensions this binary was compiled to use.
  //
  // Comparing a run that used SHA-NI against one that did not measures the
  // difference between two crypto implementations, not the cost of the
  // Restricted Kernel, so the host fails a comparison where the two sides
  // disagree.
  //
  // Layout, low bit first. Bits 0-7 are the set the binary was compiled for,
  // bits 8-15 the set the CPU reports, bit 16 whether the binary performs
  // runtime dispatch:
  //
  //   0  SHA-NI          4  AVX512IFMA
  //   1  AES-NI          5  AVX512VL
  //   2  PCLMULQDQ
  //   3  AVX2
  uint32 cpu_features = 8;
}

// Benchmark service for Oak performance evaluation.
service Benchmark {
  // Run a benchmark and return results.
  // method_id: 1001
  rpc RunBenchmark(RunBenchmarkRequest) returns (RunBenchmarkResponse) {
    option (.oak.micro_rpc.method_id) = 1001;
  }
}
