# Oak Proxy Client Configuration for Party A (Anonymizer Enclave)
#
# Configures the local Oak Proxy Client to establish an attested, encrypted
# Noise handshake tunnel with the Confidential Space Anonymizer workload.

listen_address = "127.0.0.1:8081"
mode = "http"

attestation_generators = []

[[attestation_verifiers]]
type = "confidential_space"
# Path to the Google Cloud Confidential Space root certificate.
# Pre-packaged in the Oak repository under oak_attestation_gcp/data/
root_certificate_pem_path = "oak_attestation_gcp/data/confidential_space_root.pem"

# Authorized sha256 container image digest of the compliance-anonymizer image.
# Replace with the digest published by terraform or docker build/push.
# Example:
# authorized_image_digests = [
#     "5fcd1d4b34992a8eec8849f12e3d573fd48fecbd6369b17d6d46259994ddb7f8"
# ]
